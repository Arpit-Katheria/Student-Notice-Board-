<!DOCTYPE html>
<html>

<head>

<title>Admin Login</title>

<link
rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}"
>

</head>

<body>

<header>

<h2>
Smart Notice Board
</h2>

<a href="/">
Public Board
</a>

</header>


<div class="form-page">

<div class="login-box login-card">

<div class="login-icon">
🔐
</div>

<h2>
Admin Login
</h2>

<p class="login-subtitle">
Sign in to manage campus notices
</p>


{% if error %}

<div class="error">
{{ error }}
</div>

{% endif %}


<form method="POST">

<label>
Username
</label>

<input
type="text"
name="username"
placeholder="Enter username"
required
>


<label>
Password
</label>

<input
type="password"
name="password"
placeholder="Enter password"
required
>


<button type="submit">
Login
</button>

</form>

</div>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
