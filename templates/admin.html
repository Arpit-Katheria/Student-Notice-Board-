{% for notice in notices %}

<div class="notice">

    <h3>{{ notice[1] }}</h3>

    <p>{{ notice[2] }}</p>

    <span>{{ notice[3] }}</span>

    <div class="actions">

        <a href="/edit/{{ notice[0] }}" class="edit">Edit</a>

        <a href="/delete/{{ notice[0] }}" class="delete">Delete</a>

    </div>

</div>

{% endfor %}
