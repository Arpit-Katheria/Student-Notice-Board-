<!DOCTYPE html>
<html>
<head>
    <title>Edit Notice</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="login-box">

    <h2>Edit Notice</h2>

    <form method="POST">

        <input
            type="text"
            name="title"
            value="{{ notice[1] }}"
            required>

        <textarea
            name="description"
            required>{{ notice[2] }}</textarea>

        <select name="category">
            <option {% if notice[3]=='Exam' %}selected{% endif %}>Exam</option>
            <option {% if notice[3]=='Event' %}selected{% endif %}>Event</option>
            <option {% if notice[3]=='Placement' %}selected{% endif %}>Placement</option>
            <option {% if notice[3]=='Holiday' %}selected{% endif %}>Holiday</option>
            <option {% if notice[3]=='Other' %}selected{% endif %}>Other</option>
            <option {% if notice[3]=='Sports' %}selected{% endif %}>Sports</option>
            <option {% if notice[3]=='Cultural' %}selected{% endif %}>Cultural</option>
            <option {% if notice[3]=='Workshop' %}selected{% endif %}>Workshop</option>
            <option {% if notice[3]=='Seminar' %}selected{% endif %}>Seminar</option>
            <option {% if notice[3]=='Conference' %}selected{% endif %}>Conference</option>
            <option {% if notice[3]=='Training' %}selected{% endif %}>Training</option>
            <option {% if notice[3]=='Meeting' %}selected{% endif %}>Meeting</option>
            <option {% if notice[3]=='Announcement' %}selected{% endif %}>Announcement</option>
            <option {% if notice[3]=='Notice' %}selected{% endif %}>Notice</option>
            <option {% if notice[3]=='Alert' %}selected{% endif %}>Alert</option>
            <option {% if notice[3]=='Reminder' %}selected{% endif %}>Reminder</option>
            <option {% if notice[3]=='Update' %}selected{% endif %}>Update</option>
            <option {% if notice[3]=='News' %}selected{% endif %}>News</option>
            <option {% if notice[3]=='Information' %}selected{% endif %}>Information</option>
        </select>

        <button type="submit">Update</button>

    </form>

</div>

</body>
</html>
