<!DOCTYPE html>
<html>

<head>

<title>Edit Notice</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>

</head>

<body>

<header>

<h2>Smart Notice Board</h2>

<a href="/admin">
Dashboard
</a>

</header>


<div class="form-page">

<div class="login-box">

<div class="form-heading">

<span class="form-icon">✎</span>

<div>

<h2>Edit Notice</h2>

<p>Update announcement details</p>

</div>

</div>


<form method="POST" enctype="multipart/form-data">


<label>Notice Title</label>

<input
    type="text"
    name="title"
    value="{{ notice['title'] }}"
    required
>


<label>Description</label>

<textarea
    name="description"
    required
>{{ notice['description'] }}</textarea>


<div class="form-grid">

<div>

<label>Category</label>

<select name="category">

{% for category in [
'Exam','Event','Placement','Holiday',
'Sports','Cultural','Workshop','Seminar',
'Conference','Training','Meeting',
'Announcement','Alert','Reminder',
'Update','News','Information','Other'
] %}

<option
    value="{{ category }}"
    {% if notice['category'] == category %}
    selected
    {% endif %}
>
{{ category }}
</option>

{% endfor %}

</select>

</div>


<div>

<label>Priority</label>

<select name="priority">

<option
{% if notice['priority'] == 'Normal' %}
selected
{% endif %}
>
Normal
</option>

<option
{% if notice['priority'] == 'Important' %}
selected
{% endif %}
>
Important
</option>

<option
{% if notice['priority'] == 'Urgent' %}
selected
{% endif %}
>
Urgent
</option>

</select>

</div>

</div>


<div class="form-grid">

<div>

<label>Department</label>

<select name="department">

{% for department in [
'All Departments','CSE','IT','ECE',
'EE','ME','CE','MBA','MCA'
] %}

<option
value="{{ department }}"
{% if notice['department'] == department %}
selected
{% endif %}
>
{{ department }}
</option>

{% endfor %}

</select>

</div>


<div>

<label>Target Audience</label>

<select name="audience">

{% for audience in [
'All Students','1st Year','2nd Year',
'3rd Year','4th Year','Faculty','Staff'
] %}

<option
value="{{ audience }}"
{% if notice['audience'] == audience %}
selected
{% endif %}
>
{{ audience }}
</option>

{% endfor %}

</select>

</div>

</div>


<div class="form-grid">

<div>

<label>Publish Date & Time</label>

<input
    type="datetime-local"
    name="publish_at"
    value="{{ notice['publish_at'] or '' }}"
>

</div>


<div>

<label>Expiry Date</label>

<input
    type="date"
    name="expiry_date"
    value="{{ notice['expiry_date'] or '' }}"
>

</div>

</div>


<label>Replace Attachment</label>

<input
    type="file"
    name="attachment"
>


{% if notice['attachment'] %}

<p class="field-help">

Current attachment:
<strong>
{{ notice['attachment'] }}
</strong>

</p>

{% endif %}


<div class="checkbox-row">

<label class="check-label">

<input
    type="checkbox"
    name="featured"
    {% if notice['featured'] %}
    checked
    {% endif %}
>

⭐ Featured

</label>

</div>


<button type="submit">
    Save Changes
</button>


</form>

</div>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
