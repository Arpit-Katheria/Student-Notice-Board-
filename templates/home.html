<!DOCTYPE html>
<html>
<head>
    <title>Smart Notice Board</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    
    <h2>SMART NOTICE BOARD</h2>
    <a href="/login">Admin Login</a>
</header>
<div class="container">
    <h1>Latest Notices</h1>
    <p>Department announcements, exams and events</p>
</div>

<div class="container">

    <h2>Latest Notices</h2>

    {% for notice in notices %}

    <div class="notice">

        <h3>{{ notice[1] }}</h3>

        <p>{{ notice[2] }}</p>

        <span>{{ notice[3] }}</span>

    </div>

    {% else %}

    <p>No notices available.</p>

    {% endfor %}

</div>

</body>
</html>
